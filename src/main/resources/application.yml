server:
  port: 8081

explainability:
  service:
    url: ${EXPLAINABILITY_SERVICE_URL:http://localhost:8001}
    api-key: ${EXPLAINABILITY_API_KEY:dev-key}
  cache:
    ttl-seconds: ${EXPLAINABILITY_CACHE_TTL_SECONDS:900}

llm:
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai}
    chat-path: ${OPENROUTER_CHAT_PATH:/api/v1/chat/completions}
    model: ${OPENROUTER_MODEL:google/gemini-3.1-flash-lite-preview}
    api-key: ${OPENROUTER_API_KEY}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:20}
    temperature: ${OPENROUTER_TEMPERATURE:0.1}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://userAura:ProjectAURA@cluster0.luev8nk.mongodb.net/?appName\=Cluster0}
      database: ${MONGODB_DB:aura}
management:
  endpoints:
    web:
      exposure:
        include: health,info

